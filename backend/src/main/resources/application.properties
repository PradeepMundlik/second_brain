spring.application.name=second-brain-backend

# PostgreSQL (running via Docker - see docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/secondbrain
spring.datasource.username=second_brain_admin
spring.datasource.password=second_brain
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# "update" creates/alters tables automatically — fine for dev, use migrations (Flyway) in prod
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# Python AI service
ai.service.url=http://localhost:8000
